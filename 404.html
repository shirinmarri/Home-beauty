<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="refresh" content="0; url=/Home-beauty/" />
    <script>
      // Redirect all 404s to index.html for Angular routing
      (function() {
        var redirect = '/Home-beauty/';
        var l = window.location;
        var path = l.pathname.replace(/\/Home-beauty\//, '').replace(/\/+/g, '/');
        if (path && path !== '/') {
          redirect += '#' + path + l.search + l.hash;
        }
        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
